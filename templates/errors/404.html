{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 5rem 1.5rem;">
  <h2 style="font-size: 3rem; color: var(--border); margin-bottom: 0.5rem;">404</h2>
  <h3>Page not found</h3>
  <p>The page you are looking for does not exist or has been moved.</p>
  <div class="flex gap-1 mt-2" style="justify-content: center;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Dashboard</a>
    <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
  </div>
</div>
{% endblock %}
